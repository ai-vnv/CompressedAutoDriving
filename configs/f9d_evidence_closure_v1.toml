# ITERATION 4 (fix round 1, coordinator-directed). Iteration 3's projection
# (58.0 frames, mean 14.5/seed, stdev 8.54/seed) cleared all three
# pre-registered minima, but the coordinator's exhaustive resample of all
# C(8,4)=70 four-seed subsets of the development data found a 22.9% chance
# of a 4-seed frame sum landing BELOW the 50-frame minimum (min subset sum
# 31, median 58) -- a real, quantified risk against an un-rerenderable
# final seed. Events (0/70 below 12) and seed-count (0/70 below 3) carry no
# such risk. FIX: raise the yield, not lower the minimum. Target ~21
# frames/seed on development seeds (~1.45x iteration 3's 14.5), per the
# coordinator's own scaling analysis (1.45x -> ~4.3% resampled fail rate).
#
# Two explicit constraints from the coordinator, both honored below:
#   (1) breadth over depth -- every addition below is a NEW named scenario
#       at a novel offset/heading/rate combination, none is a lengthened
#       copy of an existing one. No `steps` value below exceeds 170 (the
#       existing maximum), and several new scenarios explicitly probe
#       PARAMETER GAPS the first 10 scenarios left untested (offset 0.10 and
#       0.30 were never tried; the mid_rate 0.9 rad/s variant existed only
#       for right_to_left, never its left_to_right mirror; the confirmed-
#       effective 0.8 rad/s rate was never tried at near range, only the
#       deliberately gentle 0.6 rad/s was).
#   (2) reduce cross_mid_edge_turning_right_to_left's 40%-of-frames /
#       29%-of-events concentration -- none of the 7 new scenarios below
#       duplicate its exact (offset=0.20, angular=0.8, right_to_left)
#       recipe; they sample different offsets, different angular rates, or
#       the opposite direction, so the dominant scenario's SHARE of the
#       total falls even if its own raw count is untouched.

[[outlier_scenario_matrix]]
name = "cross_offset10_turning_right_to_left"
pedestrian_mode = "cross_right_to_left"
linear_velocity_mps = 0.20
angular_velocity_rad_s = 0.8
steps = 160
ego_start_x_offset_m = 0.10
ego_heading_offset_rad = -0.20
use_for_final = true

