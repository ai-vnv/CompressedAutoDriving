# ---------------------------------------------------------------------------
# Task 4: absence scenarios (B1 genuine out-of-domain, B2 controlled
# in-domain detector dropout, B3 controlled target disappearance -- kept
# strictly apart per-row via `kind`, never merged in the yield probe or the
# final analysis). `use_for_final = false` on every entry until Task 5
# freezes this matrix, mirroring Task 3's outlier_scenario_matrix discipline.
#
# B1: STATIONARY pedestrian, straight-driving ego (angular_velocity_rad_s =
# 0.0 always, to keep invalid-pose risk near zero per Task 3's own finding
# that straight-line scenarios complete cleanly). The ego simply drives
# forward past the fixed pedestrian; once the ego's position passes the
# pedestrian's, the pedestrian falls behind the camera (y_forward <= 0),
# which `PredictedObservabilityModel` classifies OUTSIDE_DOMAIN and GT
# silhouette sampling reports not eligible-visible -- entirely natural, no
# intervention. `steps` is sized so each scenario keeps running well past
# that crossing point.
#
# B2: STATIONARY pedestrian, near-zero ego motion (linear_velocity_mps in
# {0.0, 0.05}, angular always 0.0) so the pedestrian stays eligible-visible
# for the WHOLE episode -- B2 must never let the pedestrian leave the frame
# on its own, or a dropout run would be contaminated by genuine absence.
# `dropout_window_frames`/`dropout_warmup_frames` configure a
# `DetectorDropout` instance per scenario; `dropout_warmup_frames` gives the
# track time to become active (detected, associated, gated, existence >=
# initialization_threshold) before the window starts, so the run tests an
# ESTABLISHED track's decay, not a track that was never allowed to form.
#
# B3: STATIONARY pedestrian, near-zero ego motion (same reasoning as B2).
# `removal_warmup_frames`/`removal_tail_frames` configure a
# `TargetRemovalScheduler`; `removal_tail_frames` is a guaranteed floor on
# the run length regardless of where the seed places the switch frame.

[[absence_scenario_matrix]]
name = "b1_pass_slow"
kind = "B1"
pedestrian_mode = "stationary"
linear_velocity_mps = 0.15
angular_velocity_rad_s = 0.0
steps = 230
ego_start_x_offset_m = 0.0
ego_heading_offset_rad = 0.0
use_for_final = true

