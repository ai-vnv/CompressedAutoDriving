[surrogate]
required_kind = "exact pre-conversion fake-quantized QAT state from the A7 run"
search_roots = ["../artifacts/f12_belief_ppo_compression_v1"]
minimum_rows_per_phase = 100
maximum_v_mae_mps = 0.002
maximum_v_p99_abs_error_mps = 0.010
maximum_v_abs_error_mps = 0.050
maximum_omega_mae_rad_s = 0.030
maximum_omega_p99_abs_error_rad_s = 0.100
maximum_omega_abs_error_rad_s = 0.500
minimum_pearson = 0.999
minimum_spearman = 0.995
minimum_saturation_agreement = 0.995
minimum_omega_sign_agreement = 0.995

[replay]
calibration_source = "F11 development public trace only"
original_tolerance_formula = "max(5e-6, 2 * development_max_abs_replay_error)"
a7_tolerance_formula = "max(1e-7, 2 * development_max_abs_repeat_error)"
original_minimum_tolerance = 0.000005
a7_minimum_tolerance = 0.0000001
sham_multiplier = 1.0

[attribution]
method = "phase-conditioned distributional multi-reference Integrated Gradients"
groups = ["Lane", "Ego", "StopLine", "Pedestrian", "Stop", "PreviousAction"]
phases = ["nominal", "lane_curve", "pedestrian_relevant", "stop_required", "stop_satisfied"]
outputs = ["v_cmd_mps", "omega_cmd_rad_s"]
minimum_group_spearman = 0.70
maximum_group_share_l1 = 0.40
minimum_top_group_preservation_fraction = 0.80
minimum_top_two_jaccard = 0.50
minimum_structurally_preserved_cells = 8
total_phase_action_cells = 10

[counterfactual]
interventions = ["pedestrian_absent", "stop_absent", "lane_centered", "lane_low_confidence", "previous_action_neutral", "sham"]
primary_phases = ["pedestrian_relevant", "stop_required", "lane_curve", "nominal"]
minimum_direction_agreement = 0.90
maximum_normalized_mean_effect_drift = 0.10
maximum_normalized_p95_effect_drift = 0.25
# Frozen PPO observation clip; this is not the [-1, 1] action bound.
maximum_normalized_absolute_value = 3.0

[stress]
stage = "c4"
exploratory_seeds = [179001, 179002, 179003, 179004]
confirmatory_seeds = [179101, 179102, 179103, 179104]
episode_horizon_steps = 2200
sentinels = ["pedestrian_action_saturation", "post_stop_action_ordering"]
action_saturation_threshold = 0.98
trigger_saturation_rate_increase = 0.05
trigger_mean_v_action_drift_mps = 0.04
trigger_mean_omega_action_drift_rad_s = 0.80
minimum_confirmatory_repetitions = 2
pairwise_same_seed_required = true
scenario_parameter_search_permitted = false

[classification]
behavioral_new_failure_minimum_count = 2
semantic_preservation_requires_valid_attribution = true
overall_pass_requires_behavior_preserved = true

[artifacts]
directory = "../artifacts/f13_explain_compressed_v1"
