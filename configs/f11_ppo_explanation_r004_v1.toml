[data]
stage = "c4"
locked_evaluation_seeds = [177101, 177102, 177103, 177104, 177105, 177106, 177107, 177108]
forbidden_development_seeds = [177001, 177002, 177003, 177004]
maximum_episode_steps = 2200
sample_stride = 4
store_privileged_truth = false
once_only = true

[phases]
pedestrian_existence_threshold = 0.4
pedestrian_relevant_max_range_m = 1.2
lane_curve_min_abs_curvature_inv_m = 1.5
stop_satisfied_vicinity_m = 0.5
required = ["nominal", "lane_curve", "pedestrian_relevant", "stop_required", "stop_satisfied"]
minimum_sampled_frames = 4

[reference_distribution]
kind = "locked_same_phase_distinct_cross_seed_empirical_public"
draw_seeds = [2026081501, 2026081502, 2026081503, 2026081504, 2026081505, 2026081506]
references_per_input = 4
distinct_reference_seeds_per_draw = 4
sample_without_replacement = true
exclude_factual_seed = true
condition_on_public_phase = true
minimum_other_seed_support = 4
insufficient_support_action = "classify_phase_and_r004_limited_without_fallback"

[attribution]
targets = ["v_cmd_mps", "omega_cmd_rad_s"]
path_steps = 128
sample_batch_size = 128
draw_estimator = "mean_of_four_reference_igs"
final_estimator = "mean_of_six_draw_attributions"
effective_reference_count = 24
primary_statistic = "six_group_absolute_share"
individual_features_are_secondary = true

[bootstrap]
unit = "locked_evaluation_seed"
replicates = 2000
seed = 2026081599
confidence_level = 0.95

[gate]
completeness_median_absolute_tolerance = 1.0e-4
completeness_p99_absolute_tolerance = 1.0e-3
minimum_median_pairwise_group_spearman = 0.5
minimum_group_sign_agreement = 0.6
minimum_top_group_pair_agreement = 0.33
maximum_median_group_share_l1 = 0.75
require_all_public_phases = true
require_distinct_cross_seed_references = true
require_no_privileged_truth = true
thresholds_are_immutable = true

[output]
directory = "../artifacts/f11_ppo_explanation_v2/r004"
launch_claim = "once_only_launch_claim.json"
trace = "locked_public_trace.npz"
trace_manifest = "locked_trace_manifest.json"
references = "reference_draws.npz"
draw_attributions = "distributional_integrated_gradients.npz"
final_attributions = "final_mean_attribution.npz"
group_rows = "final_group_attribution.csv"
group_summary = "final_group_summary.csv"
metrics = "final_attribution_metrics.json"
