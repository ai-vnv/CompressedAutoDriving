# F10-PPO Visual-Lane v4, Task 1: lane-belief UNCERTAINTY recalibration.
#
# This config changes only the *reported* sigma of the lane belief. The mean
# estimate, point extractor, and bias calibration are untouched and remain
# governed entirely by lane_belief_v1.toml (referenced below by SHA256) --
# this file adds a post-hoc widening map on top of it, it does not replace it.
#
# Fitted and verified against artifacts/visual_lane/lane_belief_final_validation.csv
# (2400 rows, held-out seeds 36501-36502, small_loop + experiment_loop, CCW),
# by experiments/calibrate_lane_belief_uncertainty.py. See
# artifacts/visual_lane/lane_belief_uncertainty_v4_metrics.json for the full
# reproduced numbers and .superpowers/sdd/2026-08-11-f10-ppo-visual-v4-lane-competence/task-1-report.md
# for the derivation.
#
# Why the effective pre-v4 floor was 0.0197 rad, not the 0.015 configured in
# lane_belief_v1.toml's heading_std_floor_rad: that key floors the *raw,
# per-frame measurement* std (perception/lane_measurement.py), not the
# EKF's *posterior* std reported as belief_heading_std_rad. The posterior std
# is the fixed point of the EKF's Riccati recursion over the coupled 3-state
# [lateral, heading, curvature] filter (belief/lane_ekf.py) -- process noise
# (heading_process_std_rad_per_sqrt_s = 0.025) is re-injected every predict
# step, and the correction only partially removes it because of the
# lateral/heading coupling in the motion Jacobian and detection_validity_gain
# = 0.65 damping the effective Kalman gain. That fixed point, not the raw
# measurement floor, is what settled at ~0.0197 rad across the validation set
# (38.2% of samples pinned to it) -- this is a property of the filter
# dynamics, not a single config key.
#
# Lateral note: no (scale, floor) pair satisfies both the coverage_68 and
# coverage_95 bands simultaneously -- the lateral |error|/sigma distribution
# is the wrong shape (p50 z = 3.01 against a Gaussian's 0.67), not merely the
# wrong scale. lateral_scale = 4.0 was chosen to land coverage_68 in-band;
# coverage_95 over-covers as a documented, disclosed consequence (see
# lateral_overcoverage_disclosure in the metrics artifact). lateral_coverage_95
# is reported but intentionally absent from [uncertainty_gate] below.

source_config = "lane_belief_v1.toml"
source_config_sha256 = "41df028bf6290eef80cc5aab8114a7b7ccb0c4b19db6c3b7919a0ac68d552272"
validation_csv = "artifacts/visual_lane/lane_belief_final_validation.csv"
validation_csv_sha256 = "a22aed04cbb9095028a6f0f04a582402dd022f62140c4e2e974468e82cd4dddf"

[lane_belief_uncertainty]
# std' = max(std * scale, floor), applied to the EKF's reported posterior std.
# Verified against 2400 held-out validation rows: cov68 0.602, cov95 0.925,
# sigma/rmse 0.76 for heading; cov68 0.738, cov95 1.000 (over-covers,
# disclosed, not gated), sigma/rmse 1.33 for lateral.
heading_floor_rad = 0.051
heading_scale = 1.0
lateral_floor_m = 0.0
lateral_scale = 4.0

[uncertainty_gate]
heading_coverage_68_band = [0.60, 0.76]
heading_coverage_95_band = [0.90, 0.98]
lateral_coverage_68_band = [0.60, 0.76]
maximum_sigma_over_rmse  = 1.5
maximum_heading_rmse_rad = 0.15    # retained from v3 -- accuracy must not regress
