[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duckie-pomdp"
version = "0.0.1"
description = "Problem-formulation scaffold for a belief-aware Duckietown agent"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.24,<2",
  "tomli>=2; python_version<'3.11'",
]

[project.optional-dependencies]
simulator = [
  "duckietown-gym-daffy==6.1.34",
  "gym>=0.23,<0.27",
  "pyglet>=1.5,<2",
]
perception = ["ultralytics==8.4.116"]
training = ["wandb==0.28.1"]
test = ["pytest>=7,<10", "pytest-cov>=4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["duckie_pomdp*"]
