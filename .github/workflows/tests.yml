name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bare-clone:
    # What a reader who clones the repository can run, minus the modules that
    # need a working GL context. tests/conftest.py leaves the provenance suite
    # uncollected because the evaluation artifacts are not distributed, and
    # SKIP_SIMULATOR_TESTS leaves out the simulator modules.
    #
    # Python is pinned to 3.10 deliberately. The duckietown dependency chain
    # patches typing.TypeVar, which fails on 3.12, and pyproject.toml declares
    # the same bound.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python dependencies
        # constraints.txt pins the simulator chain exactly. Installed without
        # it, the duckietown dependencies resolve to releases that reject each
        # other's arguments at runtime.
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt pillow "tomli>=2" "pytest>=7,<10" "pytest-cov>=4"
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -c constraints.txt duckietown-gym-daffy gym pyglet

      - name: Run the suite with coverage
        # The seven modules that construct the real simulator are left out
        # here. They pass against a local Gym-Duckietown install but depend on
        # the host GL stack and on how the duckietown dependency chain resolves
        # there, which is not something this repository can assert about a
        # hosted runner. They stay part of the local suite.
        env:
          PYTHONPATH: src:experiments
          DUCKIETOWN_HEADLESS: "1"
          CUBLAS_WORKSPACE_CONFIG: ":4096:8"
          SKIP_SIMULATOR_TESTS: "1"
        run: |
          python -m pytest tests -q \
            --cov=src/duckie_pomdp --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: bare-clone
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
