name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bare-clone:
    # What a reader who clones the repository can run: the part of the suite
    # that needs no downloaded evaluation artifacts. tests/conftest.py leaves
    # the provenance suite uncollected here, so a green run means the 378
    # artifact-independent tests pass on a clean machine.
    #
    # Python is pinned to 3.10 deliberately. The duckietown dependency chain
    # patches typing.TypeVar, which fails on 3.12, and pyproject.toml declares
    # the same bound.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install the OpenGL runtime and a virtual display
        # The simulator tests open a GL context. In headless mode pyglet goes
        # through EGL, so the EGL and GLES runtimes are what actually matter;
        # xvfb covers the paths that still want an X display.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglu1-mesa libglib2.0-0 \
            libegl1 libgles2 libosmesa6 libglx-mesa0

      - name: Install Python dependencies
        # constraints.txt pins the simulator chain exactly. Installed without
        # it, the duckietown dependencies resolve to releases that reject each
        # other's arguments at runtime.
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt pillow "tomli>=2" "pytest>=7,<10" "pytest-cov>=4"
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -c constraints.txt duckietown-gym-daffy gym pyglet

      - name: Run the artifact-independent suite with coverage
        env:
          PYTHONPATH: src:experiments
          DUCKIETOWN_HEADLESS: "1"
          CUBLAS_WORKSPACE_CONFIG: ":4096:8"
        run: |
          xvfb-run -a python -m pytest tests -q \
            --cov=src/duckie_pomdp --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: bare-clone
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
