# Stop-only experiment_loop.  Road and camera geometry are unchanged from V15;
# only the sign is moved from the lane edge onto an external roadside shoulder.
tiles:
- [curve_left/W, straight/W,    curve_left/N,  floor]
- [straight/S,   floor,         curve_right/W, curve_left/N]
- [curve_left/S, curve_right/E, floor,         straight/N]
- [floor,        curve_left/S,  straight/E,    curve_left/E]

objects:
  stop_sign:
    kind: sign_stop
    # World pose (x=2.4000, z=1.4050) m.  Gym-Duckietown permits roadside
    # objects beyond the final tile; their collision/render geometry remains
    # active.  This provides 0.2355 m centre-line separation from the
    # northbound lane without changing the road image or route.
    pos: [4.1025641026, 1.4017094017]
    rotate: 90
    height: 0.18
  pedestrian:
    kind: duckie
    # Contract placeholder only; C3 removes it physically before reset.
    pos: [2.5000, 2.0598290598]
    rotate: -90
    height: 0.08
    static: false

start_tile: [3, 3]
start_pose: [[0.3144, 0.0, 0.3144], 0.7853981633974483]
tile_size: 0.585
